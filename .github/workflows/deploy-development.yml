name: Deploy Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://development.teammavericks.org
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip

      - name: Install Backend Composer Dependencies
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p deploy_payload
          # Copy compiled frontend assets
          cp -r frontend/dist/* deploy_payload/
          # Copy backend files
          cp backend/api.php deploy_payload/
          cp backend/index.php deploy_payload/
          cp backend/.htaccess deploy_payload/
          cp backend/composer.json deploy_payload/
          cp backend/composer.lock deploy_payload/
          cp -r backend/config deploy_payload/
          cp -r backend/src deploy_payload/
          cp -r backend/vendor deploy_payload/
          # Generate environment file from GitHub Secrets / defaults
          cat <<EOF > deploy_payload/.env
          DB_HOST=${{ secrets.DB_HOST || 'srv1001.hstgr.io' }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER || 'u714635531_maverickstemp' }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME || 'u714635531_managetemp' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'mav_dev_jwt_9f83a27c1b4e5d6083a712f84b90e1c' }}
          JWT_EXPIRY=${{ secrets.JWT_EXPIRY || '86400' }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.hostinger.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER=${{ secrets.SMTP_USER || 'official@teammavericks.org' }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL || 'official@teammavericks.org' }}
          SMTP_FROM_NAME="${{ secrets.SMTP_FROM_NAME || 'Team Mavericks' }}"
          FRONTEND_URL=https://development.teammavericks.org
          DISPLAY_ERRORS=true
          EOF

      - name: Deploy to Hostinger via Native Rsync
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || '89.117.157.108' }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || 'u714635531' }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || '65002' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: HOSTINGER_SSH_KEY secret is not set or empty in GitHub!"
            echo "Please go to GitHub -> Settings -> Secrets and variables -> Actions and add HOSTINGER_SSH_KEY."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Deploy files using native rsync over SSH
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            --exclude='uploads/' \
            --exclude='cache/' \
            deploy_payload/ $SSH_USER@$SSH_HOST:/home/u714635531/domains/teammavericks.org/public_html/development/

          # Ensure directories and permissions
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "mkdir -p /home/u714635531/domains/teammavericks.org/public_html/development/uploads /home/u714635531/domains/teammavericks.org/public_html/development/cache && chmod 755 /home/u714635531/domains/teammavericks.org/public_html/development/uploads"
