name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://manage.teammavericks.org
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip

      - name: Install Backend Composer Dependencies
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p deploy_payload
          # Copy compiled frontend assets
          cp -r frontend/dist/* deploy_payload/
          # Copy backend files
          cp backend/api.php deploy_payload/
          cp backend/index.php deploy_payload/
          cp backend/.htaccess deploy_payload/
          cp backend/composer.json deploy_payload/
          cp backend/composer.lock deploy_payload/
          cp -r backend/config deploy_payload/
          cp -r backend/src deploy_payload/
          cp -r backend/vendor deploy_payload/
          # Generate environment file from GitHub Secrets
          cat <<EOF > deploy_payload/.env
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=${{ secrets.JWT_EXPIRY || '86400' }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.hostinger.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL || 'official@teammavericks.org' }}
          SMTP_FROM_NAME="${{ secrets.SMTP_FROM_NAME || 'Team Mavericks' }}"
          FRONTEND_URL=https://manage.teammavericks.org
          DISPLAY_ERRORS=false
          EOF

      - name: Deploy to Hostinger via SSH Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "deploy_payload/"
          REMOTE_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          TARGET: "/home/u714635531/domains/teammavericks.org/public_html/manage/"
          EXCLUDE: "/uploads/, /cache/"

      - name: Ensure Server Permissions & Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          script: |
            mkdir -p /home/u714635531/domains/teammavericks.org/public_html/manage/uploads
            mkdir -p /home/u714635531/domains/teammavericks.org/public_html/manage/cache
            chmod 755 /home/u714635531/domains/teammavericks.org/public_html/manage/uploads
            chmod 755 /home/u714635531/domains/teammavericks.org/public_html/manage/cache
